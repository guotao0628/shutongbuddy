name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Manuscript typography check
        run: npm run check:typo

      - name: Build site
        run: npm run build

      - name: Internal link check
        run: npm run check:links

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 7

      # 说明：GitHub Pages 的官方部署流程不支持「每个 PR 一个线上预览地址」。
      # 这里把构建产物作为 artifact 上传，审阅者可下载 dist.zip 本地打开；
      # 需要真正的托管预览请接入 Netlify / Cloudflare Pages（附带各自的 Token）。
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr${{ github.event.pull_request.number }}
          path: ./dist
          retention-days: 14
