name: Deploy mdBook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      - name: Install mdbook-epub
        run: cargo install mdbook-epub --locked

      - name: Build book (HTML + EPUB)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mdbook build

      - name: Rename EPUB (URL-friendly)
        run: |
          if [ -f "book/epub/DeepSeek Harness 应用开发实践.epub" ]; then
            mv "book/epub/DeepSeek Harness 应用开发实践.epub" book/epub/deepseek-harness-in-practice.epub
          fi
          ls -la book/epub/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
