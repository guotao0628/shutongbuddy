name: Deploy mdBook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mdBook
        run: |
          curl -fSL --retry 3 -o mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf mdbook.tar.gz
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      - name: Install mdbook-epub
        run: cargo install mdbook-epub --locked

      - name: Build EPUB (best-effort, saved aside)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p /tmp/epub-out
          mdbook-epub --standalone . || echo "EPUB 生成跳过/失败"
          find . -name "*.epub" -exec cp {} /tmp/epub-out/ \; || true
          ls -la /tmp/epub-out/ || true

      - name: Build HTML site
        run: |
          mdbook build
          echo "--- book/ 内容（前 20 项）---"
          ls -la book/ | head -20
          test -f book/index.html && echo "✅ index.html 存在" || (echo "❌ index.html 缺失" && exit 1)

      - name: Combine EPUB into site
        run: |
          mkdir -p book/epub
          if ls /tmp/epub-out/*.epub >/dev/null 2>&1; then
            cp /tmp/epub-out/*.epub book/epub/deepseek-harness-in-practice.epub
            echo "✅ EPUB 已合并"
          else
            echo "⚠️ 无 EPUB，跳过"
          fi
          ls -la book/epub/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
