name: Lighthouse budgets

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # 直接在本机运行 LHCI（而非 Docker 版 action），这样 lighthouserc.json 里的
      # startServerCommand（npm run preview）才能在 runner 上正常启动。
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7
