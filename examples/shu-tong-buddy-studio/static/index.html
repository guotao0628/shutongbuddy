<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ShuTongBuddy Studio</title>
<style>
  :root { --bg:#f7f7f8; --panel:#fff; --border:#e5e5e5; --text:#1a1a1a; --muted:#8a8a8a; --accent:#2ea44f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  #app { display: flex; flex: 1; overflow: hidden; }
  aside { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; }
  #stages { width: 200px; }
  #stages h3, #panel h3 { font-size: 13px; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted); }
  #stages ul { list-style: none; }
  #stages li { padding: 10px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  #stages li.active { background: #eef7f0; color: var(--accent); font-weight: bold; }
  #stages li.done::after { content: " ✓"; color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; font-size: 14px; }
  .card .title { font-weight: bold; margin-bottom: 4px; }
  .card .out { white-space: pre-wrap; color: var(--muted); font-size: 13px; }
  #composer { display: flex; padding: 12px; border-top: 1px solid var(--border); background: var(--panel); }
  #composer input { flex: 1; padding: 10px 14px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; }
  #composer button { margin-left: 8px; padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #panel { width: 220px; border-right: none; border-left: 1px solid var(--border); }
</style>
</head>
<body>
<div id="app">
  <aside id="stages">
    <h3>备考阶段</h3>
    <ul id="stage-list"></ul>
  </aside>
  <main>
    <div id="chat"></div>
    <div id="composer">
      <input id="course" placeholder="输入课程名，如：高等数学" />
      <button onclick="start()">开始备考</button>
    </div>
  </main>
  <aside id="panel">
    <h3>题库 / 错题本</h3>
    <div id="panel-body" style="padding:12px;font-size:13px;color:#8a8a8a;">工作区 question-bank.json / mistakes.json 将在此展示。</div>
  </aside>
</div>
<script>
const STAGES = ['organize','drill','tutor','analyze','plan','report'];
const NAMES = {'organize':'知识点梳理','drill':'题库刷题','tutor':'AI 答疑','analyze':'错题分析','plan':'复习计划','report':'学习报告'};
STAGES.forEach(s => {
  const li = document.createElement('li');
  li.id = 'stage-' + s;
  li.textContent = NAMES[s];
  document.getElementById('stage-list').appendChild(li);
});
function start() {
  const course = document.getElementById('course').value || '高等数学';
  const es = new EventSource('/pipeline/start?course=' + encodeURIComponent(course));
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="title">[${ev.title}] ${ev.status === 'running' ? '进行中…' : '完成'}</div>
                      <div class="out">${ev.output || ''}</div>`;
    document.getElementById('chat').appendChild(card);
    const li = document.getElementById('stage-' + ev.stage);
    if (li) li.className = ev.status === 'done' ? 'done' : 'active';
    if (ev.status === 'done') es.close();
  };
}
</script>
</body>
</html>
